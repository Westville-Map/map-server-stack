<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- Head -->
  <circle cx="13" cy="4" r="2.5" fill="#15803d" />
  
  <!-- Torso -->
  <line x1="13" y1="6.5" x2="11.5" y2="13" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Front Leg (stepping forward) -->
  <path d="M 11.5,13 L 14.5,17.5 L 17,21" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Back Leg (swinging backward) -->
  <path d="M 11.5,13 L 9.5,17 L 7,19.5" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Front Arm (swinging forward) -->
  <path d="M 13,7.5 L 15.5,11 L 14.5,14" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Back Arm (swinging backward) -->
  <path d="M 13,7.5 L 10,10.5 L 8.5,12.5" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
