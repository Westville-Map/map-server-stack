<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function() {
        var supportsCustomElements = 'customElements' in window;
        var supportsFetch = 'fetch' in window;
        var supportsESModules = 'noModule' in document.createElement('script');
        var supportsURL = 'URL' in window && 'URLSearchParams' in window;

        var isTier1Supported = supportsCustomElements && supportsFetch && supportsESModules && supportsURL;

        var supportsWebGL2 = (function() {
          try {
            var canvas = document.createElement('canvas');
            return !!window.WebGL2RenderingContext && !!canvas.getContext('webgl2');
          } catch (e) {
            return false;
          }
        })();

        // Global fallback map error display function (only called on catastrophic map failure)
        window.showMapError = function(errorMsg) {
          if (document.getElementById('unsupported-browser-overlay')) {
            return; // Already showing an error
          }

          var heading = 'Interactive Map Unavailable';
          var message = 'Your web browser or device failed to render the interactive map canvas. This could be due to a lack of WebGL 2 hardware acceleration, or an unexpected runtime error.';

          if (errorMsg) {
            message += '<br><br><span style="font-size:12px;color:#cc3333;font-family:monospace;word-break:break-all;">Error: ' + errorMsg + '</span>';
          }

          var warningDiv = document.createElement('div');
          warningDiv.id = 'unsupported-browser-overlay';
          warningDiv.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#F4F7F6;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:\'Open Sans\',sans-serif;color:#2B659F;padding:20px;box-sizing:border-box;';
          warningDiv.innerHTML = 
            '<div style="max-width:500px;text-align:center;background:#fff;padding:32px 28px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);border-top:5px solid #E5C158;">' +
              '<h2 style="margin-top:0;font-size:22px;font-weight:600;color:#2B659F;">' + heading + '</h2>' +
              '<div style="color:#555;line-height:1.6;font-size:14px;margin:16px 0;">' + message + '</div>' +
              '<p style="color:#666;font-size:14px;margin-bottom:30px;line-height:1.5;">Please upgrade to a modern version of Google Chrome, Mozilla Firefox, Apple Safari, or Microsoft Edge.</p>' +
              '<div style="font-weight:bold;font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;">Westville Interactive Map Project</div>' +
            '</div>';
          
          if (document.body) {
            document.body.appendChild(warningDiv);
            var mapEl = document.getElementById('map');
            if (mapEl) mapEl.style.display = 'none';
          } else {
            document.write(warningDiv.outerHTML);
          }
        };

        // Non-destructive runtime error logging (never destroys active map DOM on extension/third-party errors)
        window.onerror = function(message, source, lineno, colno, error) {
          console.warn('[Festival Map Runtime Diagnostic]', message, source ? ('at ' + source + ':' + lineno) : '');
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? (event.reason.message || event.reason) : event.reason;
          console.warn('[Festival Map Promise Diagnostic]', reason);
        });

        if (!isTier1Supported || !supportsWebGL2) {
          var heading = !isTier1Supported ? 'Browser Not Fully Supported' : 'Interactive Map Unavailable';
          var message = !isTier1Supported 
            ? 'We apologize, but this modern interactive map requires a newer web browser to function. We use modern web technologies like ES modules and Web Components to deliver a premium mapping experience.'
            : 'Your web browser or device does not support WebGL 2, which is required to load our high-performance hardware-accelerated interactive map.';

          document.write(
            '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#F4F7F6;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:\'Open Sans\',sans-serif;color:#2B659F;padding:20px;box-sizing:border-box;">' +
              '<div style="max-width:500px;text-align:center;background:#fff;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);border-top:5px solid #E5C158;">' +
                '<h2 style="margin-top:0;font-size:24px;font-weight:600;">' + heading + '</h2>' +
                '<p style="color:#555;line-height:1.6;font-size:15px;margin:20px 0;">' + message + '</p>' +
                '<p style="color:#666;font-size:14px;margin-bottom:30px;line-height:1.5;">Please upgrade to a modern version of Google Chrome, Mozilla Firefox, Apple Safari, or Microsoft Edge.</p>' +
                '<div style="font-weight:bold;font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase;">Westville Interactive Map Project</div>' +
              '</div>' +
            '</div>'
          );
          if (window.stop) {
            window.stop();
          } else {
            document.execCommand('Stop');
          }
        }
      })();
    </script>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Westville Fall Festival Map</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />   
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css" />
    <link rel="stylesheet" href="westville-map.css">
    <script src="/vendor/maplibre-gl/maplibre-gl.js"></script>
    <script type="module" src="festival-map.js"> </script>
    <style>
      body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
      #map { height:100%; width:100%; }
      /* Custom Autumn Popups to override default dark blue styles */
      .maplibregl-popup-content {
        font-family: 'Open Sans', sans-serif;
        background-color: #fdfaf7 !important; /* Creamy ivory background */
        border: 2px solid #d97706 !important; /* Elegant harvest gold/amber border */
        border-radius: 12px !important;
        padding: 16px 20px !important;
        box-shadow: 0 10px 25px rgba(120, 53, 4, 0.15), 0 4px 10px rgba(0, 0, 0, 0.08) !important;
        color: #2d1b10 !important; /* High-contrast dark brown/charcoal text */
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      /* Custom Popup Tip (Arrow) */
      .maplibregl-popup-anchor-top-right .maplibregl-popup-tip , .maplibregl-popup-anchor-top-left .maplibregl-popup-tip, .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: #fdfaf7 !important; }
      .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip , .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip , .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #fdfaf7 !important; }
      .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #fdfaf7 !important; }
      .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #fdfaf7 !important; }

      /* Close Button Styling */
      .maplibregl-popup-close-button {
        color: #78350f !important; /* Deep amber/brown for readability */
        font-size: 1.2rem !important;
        top: 8px !important;
        right: 8px !important;
        font-weight: bold !important;
        opacity: 0.8;
        transition: opacity 0.15s, background-color 0.15s;
        padding: 4px 8px !important;
        border: none !important;
        background: transparent !important;
      }
      .maplibregl-popup-close-button:hover {
        opacity: 1;
        background-color: rgba(120, 53, 4, 0.08) !important;
        border-radius: 6px;
      }
      /* Custom Festival Markers to prevent MapLibre transform conflicts */
      .festival-marker-container {
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none; /* Let pointer events pass to inner element */
      }
      .festival-marker-inner {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2.5px solid #ffffff;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 14px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.35);
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s;
        pointer-events: auto; /* Enable hover/clicks on inner circle */
      }
      .festival-marker-inner:hover {
        transform: scale(1.15);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
  </body>
</html>
