services:
  westvillemap_tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env

  wvmap_webserver:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - WEB_DOMAINS=${WEB_DOMAINS:-westville.app:80, www.westville.app:80}
      - MAP_DOMAINS=${MAP_DOMAINS:-map.westville.app:80, map.westville.app:80}
      - CSP_FRAME_ANCESTORS=${CSP_FRAME_ANCESTORS:-https://map.westville.app https://www.westville.app https://westville.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./map:/var/www/map
      - ./data:/var/www/map/data
      - ./www:/srv/www/
      - ./data:/srv/www/data/
    depends_on:
      - wvmap_backend

  # API Backend
  wvmap_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
