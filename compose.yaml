services:
  westvillemap_tunnel:
    container_name: cloudflared-tunnel-westvillemap
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env

  wvmap_webserver:
    image: caddy:2-alpine
    container_name: wvmap_webserver
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./html:/var/www/html
      - ./data:/var/www/html/data
      - ./www:/srv/www/
      - ./data:/srv/www/data/
    depends_on:
      - wvmap_backend

  # API Backend
  wvmap_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wvmap_backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
