version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/app"
    target-branch: "testing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Docker container images (backend/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "testing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # Docker Compose service images (compose.yaml)
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # Frontend vendor dependencies (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
