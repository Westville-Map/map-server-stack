name: Frontend Vendor Sync & Verification

on:
  push:
    branches:
      - testing
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync-vendor.js'
      - 'map/vendor/**'
      - 'www/vendor/**'
      - 'map/fonts/**'
      - 'www/fonts/**'
      - 'map/**/*.js'
      - 'www/**/*.js'
  pull_request:
    branches:
      - testing
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync-vendor.js'
      - 'map/vendor/**'
      - 'www/vendor/**'
      - 'map/fonts/**'
      - 'www/fonts/**'
      - 'map/**/*.js'
      - 'www/**/*.js'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-verify:
    name: Sync Vendor Assets & Verify Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Synchronize Vendor Files
        run: node scripts/sync-vendor.js

      - name: Check for Vendor Diff
        id: git-diff
        run: |
          if [ -n "$(git status --porcelain map/vendor www/vendor map/fonts www/fonts)" ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-Commit Synced Vendor Assets (Dependabot PRs)
        if: github.actor == 'dependabot[bot]' && steps.git-diff.outputs.dirty == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add map/vendor www/vendor map/fonts www/fonts
          git commit -m "chore(vendor): auto-sync vendor assets to match package.json updates"
          git push

      - name: Enforce Clean Vendor State (Developer PRs / Pushes)
        if: github.actor != 'dependabot[bot]'
        run: |
          git diff --exit-code map/vendor www/vendor map/fonts www/fonts || {
            echo "ERROR: Vendored assets in map/vendor, www/vendor, map/fonts, or www/fonts are out of sync with package.json."
            echo "Run 'npm run sync-vendor' locally and commit the changes."
            exit 1
          }

      - name: Verify JavaScript Syntax
        run: |
          npm run check-syntax
          node --check app/server.js
