<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="rgba(52,152,219,0.2)" />
    </radialGradient>
  </defs>
  <!-- Reticle outer ring -->
  <circle cx="12" cy="12" r="7" fill="none" stroke="#2980b9" stroke-width="1.5" />
  <!-- Reticle inner ring -->
  <circle cx="12" cy="12" r="3" fill="none" stroke="#5dade2" stroke-width="0.75" />
  <!-- Crosshairs -->
  <line x1="12" y1="2" x2="12" y2="4.5" stroke="#2980b9" stroke-width="1.5" stroke-linecap="round" />
  <line x1="12" y1="19.5" x2="12" y2="22" stroke="#2980b9" stroke-width="1.5" stroke-linecap="round" />
  <line x1="2" y1="12" x2="4.5" y2="12" stroke="#2980b9" stroke-width="1.5" stroke-linecap="round" />
  <line x1="19.5" y1="12" x2="22" y2="12" stroke="#2980b9" stroke-width="1.5" stroke-linecap="round" />
  <!-- Central beacon dot with glow -->
  <circle cx="12" cy="12" r="2" fill="url(#beacon-glow)" />
  <circle cx="12" cy="12" r="1" fill="#fff" />
</svg>
