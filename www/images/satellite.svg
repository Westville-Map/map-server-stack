<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <!-- Bold blue gradient for the panels -->
    <linearGradient id="solar-panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Metallic grey gradient for the craft body -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Left solar panel (solid, bold blue with thick outline) -->
  <rect x="2" y="8" width="5" height="8" rx="1.5" fill="url(#solar-panel-grad)" stroke="#1e293b" stroke-width="2" />
  <!-- Panel vertical line divider (thick highlight) -->
  <line x1="4.5" y1="8" x2="4.5" y2="16" stroke="#93c5fd" stroke-width="1.5" />

  <!-- Right solar panel (solid, bold blue with thick outline) -->
  <rect x="17" y="8" width="5" height="8" rx="1.5" fill="url(#solar-panel-grad)" stroke="#1e293b" stroke-width="2" />
  <!-- Panel vertical line divider (thick highlight) -->
  <line x1="19.5" y1="8" x2="19.5" y2="16" stroke="#93c5fd" stroke-width="1.5" />

  <!-- Connector booms (thick connections) -->
  <line x1="7" y1="12" x2="10" y2="12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="14" y1="12" x2="17" y2="12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Main craft body (heavy rounded rectangle) -->
  <rect x="10" y="7" width="4" height="8" rx="1.5" fill="url(#body-grad)" stroke="#1e293b" stroke-width="2" />
  <!-- Red LED dot indicators -->
  <circle cx="12" cy="11" r="1" fill="#ef4444" />

  <!-- Transmit dish (heavy open-bottomed dome shape) -->
  <path d="M 8,16.5 C 9.5,14.5 14.5,14.5 16,16.5" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Dish probe stem -->
  <line x1="12" y1="15" x2="12" y2="18.5" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Signals radiating downwards (high contrast chunky amber arcs) -->
  <path d="M 10,20 C 11,19 13,19 14,20" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 7,22.5 C 9.5,20.5 14.5,20.5 17,22.5" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
</svg>
