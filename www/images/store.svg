<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <!-- Base Building (50% thinner stroke-width=1) -->
  <rect x="4" y="9" width="16" height="12" rx="1.5" fill="#e2e8f0" stroke="#1e293b" stroke-width="1" stroke-linejoin="round" />
  
  <!-- Large display window (no diagonal slash, stroke-width=1) -->
  <rect x="6" y="12" width="5" height="5" rx="1" fill="#bae6fd" stroke="#1e293b" stroke-width="1" />
  
  <!-- Entrance Door (stroke-width=1) -->
  <rect x="13" y="12" width="5" height="9" rx="0.5" fill="#f59e0b" stroke="#1e293b" stroke-width="1" />
  
  <!-- Awning Base (Filled red, no stroke) -->
  <path d="M 2,9 L 4,5 L 20,5 L 22,9 Z" fill="#ef4444" />
  
  <!-- Spaced vertical white stripes (Filled white, no stroke) -->
  <rect x="6.3" y="5" width="2.3" height="4" fill="#ffffff" />
  <rect x="10.8" y="5" width="2.3" height="4" fill="#ffffff" />
  <rect x="15.4" y="5" width="2.3" height="4" fill="#ffffff" />
  
  <!-- Awning Outline (drawn on top with stroke-width=1, no divider lines) -->
  <path d="M 2,9 L 4,5 L 20,5 L 22,9 Z" fill="none" stroke="#1e293b" stroke-width="1" stroke-linejoin="round" />
</svg>
