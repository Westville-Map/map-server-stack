<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <linearGradient id="printer-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#1c2833" />
    </linearGradient>
    <linearGradient id="accent-gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bdc3c7" />
      <stop offset="100%" stop-color="#95a5a6" />
    </linearGradient>
  </defs>
  <!-- Printer top paper guide / feed -->
  <path d="M6 9 L18 9 L17 3 L7 3 Z" fill="url(#accent-gray)" stroke="#1c2833" stroke-width="0.75" />
  <!-- Main body -->
  <rect x="3" y="8" width="18" height="9" rx="1.5" fill="url(#printer-body)" stroke="#1c2833" stroke-width="0.75" />
  <!-- Accent button / light -->
  <circle cx="5" cy="11" r="0.75" fill="#2ecc71" />
  <circle cx="7" cy="11" r="0.75" fill="#f1c40f" opacity="0.8" />
  <!-- Paper tray slot -->
  <rect x="5" y="13" width="14" height="2" rx="0.5" fill="#111" />
  <!-- Output paper sliding out -->
  <rect x="6" y="14" width="12" height="7" rx="0.5" fill="#ffffff" stroke="#95a5a6" stroke-width="0.5" />
  <!-- Printed lines on paper -->
  <line x1="8" y1="16" x2="16" y2="16" stroke="#2980b9" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="18" x2="14" y2="18" stroke="#27ae60" stroke-width="1" stroke-linecap="round" />
</svg>
