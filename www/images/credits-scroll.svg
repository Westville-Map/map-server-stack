<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <linearGradient id="scroll-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d35400" />
      <stop offset="100%" stop-color="#873600" />
    </linearGradient>
  </defs>
  <!-- Wooden Rollers -->
  <rect x="2" y="3" width="2" height="18" rx="0.5" fill="url(#scroll-wood)" />
  <rect x="20" y="3" width="2" height="18" rx="0.5" fill="url(#scroll-wood)" />
  <!-- Unrolled Paper -->
  <path d="M 3.5 5.5 C 5 4.5, 7 5, 9 5 L 15 5 C 17 5, 19 4.5, 20.5 5.5 L 20.5 18.5 C 19 17.5, 17 18, 15 18 L 9 18 C 7 18, 5 17.5, 3.5 18.5 Z" fill="#fdf2e9" stroke="#d35400" stroke-width="0.75" />
  <!-- Rolled edges (shading / curl) -->
  <path d="M 3.5 5.5 Q 4.5 7, 3.5 18.5" fill="none" stroke="#e59866" stroke-width="0.5" />
  <path d="M 20.5 5.5 Q 19.5 7, 20.5 18.5" fill="none" stroke="#e59866" stroke-width="0.5" />
  <!-- Inscribed lines for text -->
  <line x1="6" y1="8" x2="18" y2="8" stroke="#a04000" stroke-width="1.25" opacity="0.4" />
  <line x1="6" y1="11" x2="18" y2="11" stroke="#a04000" stroke-width="1.25" opacity="0.4" />
  <line x1="6" y1="14" x2="18" y2="14" stroke="#a04000" stroke-width="1.25" opacity="0.4" />
</svg>
