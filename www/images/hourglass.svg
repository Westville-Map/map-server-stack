<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a04000" />
      <stop offset="100%" stop-color="#5e2000" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5b041" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" opacity="0.6" />
      <stop offset="100%" stop-color="#ebf5fb" opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Wood Pillars -->
  <line x1="5.5" y1="4" x2="5.5" y2="20" stroke="#7f8c8d" stroke-width="1" />
  <line x1="18.5" y1="4" x2="18.5" y2="20" stroke="#7f8c8d" stroke-width="1" />
  <!-- Glass bulb outline -->
  <path d="M7 5 C7 10, 11 11, 11 12 C11 13, 7 14, 7 19 L17 19 C17 14, 13 13, 13 12 C13 11, 17 10, 17 5 Z" fill="url(#glass)" stroke="#bdc3c7" stroke-width="0.75" />
  <!-- Sand in top bulb -->
  <path d="M8 6 C8 10, 10.5 10.5, 11 11 L13 11 C13.5 10.5, 16 10, 16 6 Z" fill="url(#sand)" opacity="0.9" />
  <!-- Falling stream -->
  <line x1="12" y1="11" x2="12" y2="18.5" stroke="#f5b041" stroke-width="1.25" stroke-dasharray="2 1" />
  <!-- Sand pile in bottom bulb -->
  <path d="M 8.5 19 C 8.5 17, 10 16, 12 16 C 14 16, 15.5 17, 15.5 19 Z" fill="url(#sand)" />
  <!-- Wood plates Top and Bottom -->
  <rect x="4" y="2" width="16" height="2.5" rx="0.5" fill="url(#wood)" stroke="#5e2000" stroke-width="0.75" />
  <rect x="4" y="19.5" width="16" height="2.5" rx="0.5" fill="url(#wood)" stroke="#5e2000" stroke-width="0.75" />
</svg>
