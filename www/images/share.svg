<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <!-- Silvery gradient for the light/highlighted side -->
    <linearGradient id="silver-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <!-- Silvery gradient for the shadowed/darker side -->
    <linearGradient id="silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Left wing half -->
  <path d="M 21,3 L 2,13 L 10,14 Z" fill="url(#silver-light)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Right wing half -->
  <path d="M 21,3 L 10,14 L 11,22 Z" fill="url(#silver-dark)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
</svg>
