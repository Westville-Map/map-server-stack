<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <linearGradient id="compass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeded" />
      <stop offset="100%" stop-color="#95a5a6" />
    </linearGradient>
    <linearGradient id="needle-n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec7063" />
      <stop offset="100%" stop-color="#e74c3c" />
    </linearGradient>
    <linearGradient id="needle-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5dade2" />
      <stop offset="100%" stop-color="#2980b9" />
    </linearGradient>
  </defs>
  <!-- Outer Rim -->
  <circle cx="12" cy="12" r="10" fill="#2c3e50" stroke="url(#compass-rim)" stroke-width="1.5" />
  <!-- Inner Face -->
  <circle cx="12" cy="12" r="8.5" fill="#1c2833" />
  <!-- Compass Ticks -->
  <line x1="12" y1="4" x2="12" y2="5" stroke="#fff" stroke-width="1" />
  <line x1="12" y1="19" x2="12" y2="20" stroke="#fff" stroke-width="1" />
  <line x1="4" y1="12" x2="5" y2="12" stroke="#fff" stroke-width="1" />
  <line x1="19" y1="12" x2="20" y2="12" stroke="#fff" stroke-width="1" />
  <!-- Compass Needle (Points NE) -->
  <g transform="translate(12, 12) rotate(45)">
    <!-- North Pointer (Red) -->
    <path d="M 0 0 L -2 -1 L 0 -7 L 2 -1 Z" fill="url(#needle-n)" />
    <!-- South Pointer (Blue) -->
    <path d="M 0 0 L -2 1 L 0 7 L 2 1 Z" fill="url(#needle-s)" />
    <!-- Center Pin -->
    <circle cx="0" cy="0" r="1" fill="#f1c40f" />
  </g>
</svg>
